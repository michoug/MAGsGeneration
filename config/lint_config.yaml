############################################################
# Minimal, portable config used only by `pixi run snakemake_lint`.
# Paths are placeholders (not dereferenced by --lint) and work_dir is "."
# so linting doesn't require chdir-ing into a real cluster path.
# Do NOT use this file for an actual pipeline run.

steps: [
  "install_software",
  "trim_reads",
  "assembly_all",
  "contigs_taxonomy",
  "check_assembly",
  "mags_generation",
  "binning_refinement",
  "eukaryotes_filter",
  "checkm",
  "refine_all",
  "dereplicate",
  "syntracker",
  "coverage",
  "annotations",
  "quality",
  "mgthermometer",
  "eggnog",
  "singlem_all",
  "report"
 ]

work_dir: "."
assembly_dir: "assembly"
results_dir: "results"
reads_dir: "reads"

checkm2:
  db: "checkm2.db"

gtdbtk:
  path: "gtdbtk"

eggnog:
  db: "eggnog.db"
