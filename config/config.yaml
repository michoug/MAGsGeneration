############################################################
# STEPS

# Steps to be done
# ORDER of STEPS: ["checkm", "dereplicate", "drep_checkm", "coverage", "gtdbtk", "eggnog", "metabolic", "mgthermometer"]
#

steps: [
  "install_software",
  "trim_reads",
  "assembly_all",
  "contigs_taxonomy",
  "check_assembly",
  "mags_generation",
  "binning_refinement",
  "eukaryotes_filter",
  "checkm",
  "refine_all",
  "dereplicate",
  "syntracker",
  "coverage",
  "annotations",
  "quality",
  "mgthermometer",
  "eggnog",
  "singlem_all",
  "report"
 ]  ###USER INPUT REQUIRED###

############################################################
# INPUT         ###USER INPUT REQUIRED###
# Directory where the workflow exists
work_dir: "/scratch/gmichoud/Metalp/MAGsGeneration/"

# Directory where assembly files are
assembly_dir: "/scratch/gmichoud/Metalp/assembly"

# Directory to save the output to
results_dir: "/scratch/gmichoud/Metalp/Ferret"  

# Directory for raw reads
reads_dir: "/scratch/gmichoud/Metalp/reads/Ferret"

### Memory per cpus for your cluster
# Optional: defaults to DEFAULT_MEMORY_PER_THREAD_MB in workflow/rules/init.smk
# if omitted. Can also be overridden per-run without editing this file via
# --config memory_per_thread=<value>.

memory_per_thread : 7000

################
# Databases
checkm2:
  db: "/work/river/Databases/checkm2/v1.1/CheckM2_database/uniref100.KO.1.dmnd"  ###USER INPUT REQUIRED###

gtdbtk:
  path: "/work/river/Databases/GTDBTk/release232/"  ###USER INPUT REQUIRED###

eggnog:
  db: "/work/river/Databases/eggnog-mapper-2.1.12/"  ###USER INPUT REQUIRED###
