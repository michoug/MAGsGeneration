############################################################
# STEPS

# Steps to be done
# ORDER of STEPS: ["checkm", "dereplicate", "drep_checkm", "coverage", "gtdbtk", "eggnog", "metabolic", "mgthermometer"]
#

steps: [
  "install_software",
  "trim_reads",
  "assembly_all",
  "contigs_taxonomy",
  "check_assembly",
  "mags_generation",
  "binner_selection",
  "binning_refinement",
  # "eukaryotes_filter",
  "checkm",
  # "refine_all",
  # "dereplicate",
#  "syntracker",
  # "coverage",
#  "annotations",
  # "quality",
#  "mgthermometer",
#  "eggnog",
#  "singlem_all",
#  "report"
 ]  ###USER INPUT REQUIRED###

############################################################
# INPUT         ###USER INPUT REQUIRED###
# Directory where the workflow exists
work_dir: "/scratch/gmichoud/Nant/MAGsGeneration/"

# Directory where assembly files are
assembly_dir: "/scratch/gmichoud/Nant/assembly"

# Directory to save the output to
results_dir: "/scratch/gmichoud/Nant/output"  

# Directory for raw reads
reads_dir: "/scratch/gmichoud/Nant/reads/"

### Memory per cpus for your cluster

memory_per_thread : 7000

################
# Remove duplicate read pairs with fastp --dedup after human removal.
# Off by default: fastp cannot tell PCR duplicates from natural duplicates of
# abundant genomes, and dropping those distorts binning coverage and MAG
# abundance. Turn on only for low-input, PCR-amplified libraries.
dedup: false

################
# Human read removal: a pair is removed only if a mate aligns to hg38 over
# at least min_aligned_fraction of its length, with at most max_mismatch_rate
# mismatches per aligned base (short soft-clipped strobealign hits are ignored)
human_removal:
  min_aligned_fraction: 0.8
  max_mismatch_rate: 0.05

# Read mapping to assemblies/MAGs (strobealign): binning BAMs drop alignments
# covering < min_aligned_fraction of the read unless they touch a contig end;
# MAG abundances (coverm contig) use the identity / aligned-percent filters
binning_mapping:
  min_aligned_fraction: 0.8
  coverm_min_identity: 95
  coverm_min_aligned_percent: 75

################
# Databases
checkm2:
  db: "/work/river/Databases/checkm2/v1.1/CheckM2_database/uniref100.KO.1.dmnd"  ###USER INPUT REQUIRED###

gtdbtk:
  path: "/work/river/Databases/GTDBTk/release232/"  ###USER INPUT REQUIRED###

################
# Bin refinement (metawrap2 bin_refinement -c / -x)
metawrap2:
  completeness: 70
  contamination: 10

# GUNC chimerism check on metawrap2's final bins (metawrap2 annotates
# gunc_css / gunc_pass; remove_chimeric drops bins with gunc_pass "no").
# database: progenomes_3 (GUNC default), progenomes_2.1, gtdb_95 or gtdb_214;
# downloaded from Zenodo into db_dir by the install_software step (an
# existing gunc_db_*.dmnd.gz there is reused), then decompressed.
gunc:
  enabled: true
  database: "progenomes_3"
  db_dir: "/scratch/gmichoud/Nant/gunc_db"  ###USER INPUT REQUIRED###
  remove_chimeric: true

eggnog:
  db: "/work/river/Databases/eggnog-mapper-2.1.12/"  ###USER INPUT REQUIRED###

################
# Binner selection
# After the 7 binners run, score each one with CheckM2 and keep only the
# best `n` (default 3, at most one per technology family) to feed metawrap2.
# Families follow Han, Wang & Zhu, Nat Commun 16:2865 (2025),
# https://doi.org/10.1038/s41467-025-57957-6
binners:
  catalogue:
    metabat:  { family: "classical",           label: "TNF + coverage, similarity graph + label propagation" }
    concoct:  { family: "classical",           label: "k-mer + coverage, PCA + GMM" }
    rosella:  { family: "ml_clustering",       label: "TNF + coverage, UMAP + HDBSCAN" }
    metacat:  { family: "ml_clustering",       label: "composition + coverage, single-copy-gene seeded" }
    comebin:  { family: "deep_representation", label: "multi-view contrastive embedding" }
    semibin:  { family: "deep_representation", label: "semi-supervised contrastive, must-link/cannot-link" }
    taxvamb:  { family: "deep_representation", label: "VAE + taxonomy-guided (VAEVAE)" }
  selection:
    enabled: true          # false -> all seven binners (metawrap2 accepts at most 6), no scoring run
    n: 3
    one_per_family: true   # at most one binner per family, then top-n by score
    tiers:                 # CheckM2-only approximation of the MQ / NC / HQ tiers in the paper above
      mq: { completeness: 70, contamination: 10 }
      nc: { completeness: 90, contamination: 5 }
      nc_strict: { completeness: 95, contamination: 5 }
