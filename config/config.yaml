############################################################
# STEPS

# Steps to be done
# ORDER of STEPS: ["checkm", "dereplicate", "drep_checkm", "coverage", "gtdbtk", "eggnog", "metabolic", "mgthermometer"]
#
# steps: ["checkm", "dereplicate", "gtdbtk", "eggnog", "coverage", "metabolic", "mgthermometer"]  # "mdmcleaner" will be run prior to these steps
steps: ["coverage_subset","mags_generation","dastool","checkm","refine_all","dereplicate","coverage","gtdbtk","mgthermometer","eggnog"]
# ,"eggnog","metabolic","mgthermometer"]  for testing purposes

############################################################
# INPUT         ###USER INPUT REQUIRED###
# Directory where the workflow exists
work_dir: "/scratch/gmichoud/FertilityIslandMAGs"

# Directory where assembly files are
assembly_dir: "/scratch/gmichoud/FertilityIsland/Assembly"

# Directory to save the output to
results_dir: "/scratch/gmichoud/FertilityIsland/mags_all"  

# Directory for all the conda environments
env_dir: "/scratch/gmichoud/FertilityIslandMAGs/envs" 

# Directory for databases
db_dir: "/scratch/gmichoud/DB"

# Directory for trimmed reads
reads_dir: "/scratch/gmichoud/FertilityIsland/Trim"

# Number of cpus or threads to use
threads: 28


##############################
# Parameters #
filter_length:
  threads: 4

filter_n_reads:
    threads: 7
    read_p: 0.1

#################
# Coverage
mapping:
  threads: 6

#################
# Binning
metabat2:
  threads: 14

concoct:
  threads: 14

metabinner:
  length: 2000
  threads: 14

dasTool:
  threads: 14

################
# Bins
bbmap:
  threads: 2

galah:
  threads: 14
  comp: 70
  cont: 10

mdmcleaner:
  threads: 7

rosella:
  threads: 14

################
# Quality & Taxonomy
checkm2:
  threads: 20
  db: "/work/river/Databases/checkm2/CheckM2_database/uniref100.KO.1.dmnd"  ###USER INPUT REQUIRED###
  extension: "fa"  ###USER INPUT REQUIRED###
  git_path: "https://github.com/chklovski/checkm2.git"

gtdbtk:
  threads: 20
  path: "/work/river/Databases/GTDBTk/release214"  ###USER INPUT REQUIRED###


################
# Functions
metabolic:
  threads: 16
  db: "/mnt/isilon/projects/ecosystem_biology/databases/gtdbtk/release95"  ###USER INPUT REQUIRED###
  directory: "/work/projects/nomis/tools/METABOLIC"  ###USER INPUT REQUIRED###

eggnog:
  threads: 16
  final_threads: 16
  db: "/work/river/Databases/eggnog-mapper-2.1.2/data/"  ###USER INPUT REQUIRED###
