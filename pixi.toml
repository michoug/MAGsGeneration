[workspace]
authors = ["Gregoire Michoud <gregoire.michoud@gmail.com>"]
channels = ["conda-forge", "bioconda"]
name = "MAGsGeneration"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]

snake_format = "snakefmt ."
ruff_format = "ruff check scripts/"
air_format = "air format scripts/"
jarl_format = "jarl check scripts/"
test = "pytest tests/ -v"

check = { depends-on = ["snake_format", "ruff_format", "air_format", "jarl_format", "test"] }

[dependencies]

snakemake= ">=9.0,<10"
snakemake-executor-plugin-slurm= ">=2.0,<3"
snakefmt = ">=2.0.0,<3"
pathspec = ">=1.0.4,<2"
ruff = ">=0.14,<0.20"
air = ">=0.10,<0.20"
pytest-mock = ">=3.15,<4"
polars = ">=1.40,<1.50"

[pypi-dependencies]
jarl-linter = ">=0.5"


[feature.annotations]
channels = ["conda-forge", "bioconda"]

[feature.annotations.dependencies]
prodigal = "2.6.3.*"
pyrodigal = "3.5.*"

[feature.dastool]
channels = ["conda-forge", "bioconda"]

[feature.dastool.dependencies]
das_tool = "1.1.7.*"

